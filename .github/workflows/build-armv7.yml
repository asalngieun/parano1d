name: Build for ARMv7

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Dependencies & Cross-Linker
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf cmake libclang-dev pkg-config

    - name: Set up Rust Toolchain & Target ARMv7
      run: |
        rustup update stable
        rustup default stable
        rustup target add armv7-unknown-linux-gnueabihf

    - name: Configure Cargo Linker
      run: |
        mkdir -p ~/.cargo
        echo '[target.armv7-unknown-linux-gnueabihf]' >> ~/.cargo/config.toml
        echo 'linker = "arm-linux-gnueabihf-gcc"' >> ~/.cargo/config.toml
    - name: Patch Arithmetic Overflow in mdbx_store.rs
      run: |
        # Mengubah 1024isize menjadi 1024i64 atau menyesuaikan angkanya agar tidak overflow
        sed -i 's/1024isize \* 1024 \* 1024 \* 1024/1024_i64 * 1024 * 1024 * 1024/g' noid_chain/src/storage/mdbx_store.rs
        # Atau jika max_size menerima i64 / u64, pastikan tipe datanya sesuai.
        
    - name: Build Release Binary
      run: cargo build --target armv7-unknown-linux-gnueabihf --release

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: parano1d-armv7l
        path: target/armv7-unknown-linux-gnueabihf/release/parano1d
