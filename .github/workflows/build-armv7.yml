name: Build for ARMv7

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Dependencies & Cross-Linker
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf cmake libclang-dev pkg-config

    - name: Set up Rust Toolchain & Target ARMv7
      run: |
        rustup update stable
        rustup default stable
        rustup target add armv7-unknown-linux-gnueabihf

    - name: Configure Cargo Linker
      run: |
        mkdir -p ~/.cargo
        echo '[target.armv7-unknown-linux-gnueabihf]' >> ~/.cargo/config.toml
        echo 'linker = "arm-linux-gnueabihf-gcc"' >> ~/.cargo/config.toml
        - name: Patch max_size for 32-bit ARMv7 compatibility
      run: |
        # Mengubah 1024isize * ... menjadi ukuran aman untuk 32-bit (misal: 2 GiB atau isize::MAX)
        sed -i 's/max_size: Some(1024isize \* 1024 \* 1024 \* 1024)/max_size: Some(2 * 1024 * 1024 * 1024)/g' noid_chain/src/storage/mdbx_store.rs
        # Atau jika menggunakan format i64 yang sebelumnya diubah:
        sed -i 's/max_size: Some(1024_i64 \* 1024 \* 1024 \* 1024)/max_size: Some(2 * 1024 * 1024 * 1024)/g' noid_chain/src/storage/mdbx_store.rs
        
        
    - name: Build Release Binary
      run: cargo build --target armv7-unknown-linux-gnueabihf --release

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: parano1d-armv7l
        path: target/armv7-unknown-linux-gnueabihf/release/parano1d
